<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Feed the Sound Monsters!</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
  html,body{height:100%;}
  body{
    font-family:"Fredoka",system-ui,sans-serif;
    background:linear-gradient(180deg,#FFF7ED 0%,#FFFBEB 42%,#F0FDF4 100%);
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(15,23,42,.055) 1.6px,transparent 1.6px);
    background-size:26px 26px;
  }
  .blob{position:fixed;border-radius:9999px;filter:blur(70px);pointer-events:none;z-index:0;opacity:.5;}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-46px,-26px) scale(1.08)}}
  .drift1{animation:drift1 14s ease-in-out infinite}
  .drift2{animation:drift2 17s ease-in-out infinite}

  /* ---------- Title sticker typography ---------- */
  .title-lg{line-height:1.04;letter-spacing:.02em;}
  .stroke-green{color:#fff;text-shadow:
    -3px -3px 0 #16A34A,3px -3px 0 #16A34A,-3px 3px 0 #16A34A,3px 3px 0 #16A34A,
    -3px 0 0 #16A34A,3px 0 0 #16A34A,0 -3px 0 #16A34A,0 3px 0 #16A34A,
    0 9px 0 #15803D,0 16px 26px rgba(21,128,61,.38);}
  .stroke-purple{color:#fff;text-shadow:
    -3px -3px 0 #7E22CE,3px -3px 0 #7E22CE,-3px 3px 0 #7E22CE,3px 3px 0 #7E22CE,
    -3px 0 0 #7E22CE,3px 0 0 #7E22CE,0 -3px 0 #7E22CE,0 3px 0 #7E22CE,
    0 9px 0 #6B21A8,0 16px 26px rgba(107,33,168,.38);}
  .chip-title{box-shadow:0 5px 0 rgba(180,83,9,.55),0 14px 22px -8px rgba(180,83,9,.5);}

  /* ---------- Monster stages ---------- */
  .monster-stage{position:relative;}
  .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:700;pointer-events:none;user-select:none;line-height:1;padding-top:1.5rem;}
  .msvg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;}
  .drop-zone{position:absolute;left:16%;top:50%;width:68%;height:36%;z-index:5;}
  .mshadow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:58%;height:18px;
    border-radius:9999px;background:rgba(15,23,42,.16);filter:blur(6px);animation:shadowPulse 3.2s ease-in-out infinite;}
  .mshadow.delay{animation-delay:1.6s;}
  @keyframes shadowPulse{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.9}50%{transform:translateX(-50%) scaleX(.86);opacity:.6}}
  .name-tag{position:absolute;top:-18px;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:10;
    box-shadow:0 5px 0 rgba(15,23,42,.18),0 12px 20px -8px rgba(15,23,42,.3);}
  .sound-chip{box-shadow:0 3px 0 rgba(15,23,42,.08);}

  /* hover ring marching ants */
  .ring{opacity:.13;animation:ringdash 1.5s linear infinite;}
  .ring.hot{opacity:.9;}
  @keyframes ringdash{to{stroke-dashoffset:-64;}}

  /* ---------- Food cards ---------- */
  .food-card{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:linear-gradient(180deg,#FFFFFF 0%,#F8FAFC 100%);
    border:4px solid var(--accSoft);border-radius:26px;
    padding:12px 8px 10px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:none;will-change:transform;
    box-shadow:0 6px 0 var(--accSoft),0 16px 26px -14px rgba(15,23,42,.28);
    transition:box-shadow .2s ease;
  }
  .food-card::after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 40%);}
  .food-card.dragging{cursor:grabbing;
    box-shadow:0 2px 0 var(--accSoft),0 32px 44px -16px rgba(15,23,42,.42),0 0 0 5px color-mix(in srgb,var(--acc) 35%,transparent);}
  .food-card:not(.dragging):hover{box-shadow:0 8px 0 var(--accSoft),0 22px 32px -14px rgba(15,23,42,.34);}
  .art{width:100%;max-width:118px;margin:0 auto;pointer-events:none;}
  .art svg{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 9px rgba(15,23,42,.12));}
  .word{font-weight:700;color:#1E293B;letter-spacing:.04em;font-size:clamp(.95rem,3.4vw,1.45rem);line-height:1.15;margin-top:2px;white-space:nowrap;}
  .hl{font-weight:800;padding-inline:2px;}
  .hl-f{color:#059669;text-decoration:underline wavy #34D399;text-decoration-thickness:3.5px;text-underline-offset:6px;}
  .hl-th{color:#9333EA;text-decoration:underline wavy #C084FC;text-decoration-thickness:3.5px;text-underline-offset:6px;}

  /* steam wisps on soup */
  .steam{animation:steamUp 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  .steam.two{animation-delay:1.3s;}
  @keyframes steamUp{0%,100%{transform:translateY(2px);opacity:.45}50%{transform:translateY(-3px);opacity:1}}

  /* ---------- Header stars ---------- */
  .star-slot svg{fill:#E2E8F0;stroke:#CBD5E1;transition:fill .3s;}
  .star-slot.filled svg{fill:#FBBF24;stroke:#D97708;}

  /* ---------- Floating text pops ---------- */
  .poptxt{position:fixed;z-index:80;pointer-events:none;font-weight:700;color:#fff;
    padding:.3rem .95rem;border-radius:9999px;border:3px solid rgba(255,255,255,.85);
    box-shadow:0 8px 18px -6px rgba(15,23,42,.4);white-space:nowrap;font-size:1.05rem;}

  /* win stars */
  #winStars svg{filter:drop-shadow(0 4px 6px rgba(217,119,6,.4));}
  .btn-chunky{box-shadow:0 6px 0 rgba(76,29,149,.9),0 18px 26px -10px rgba(124,58,237,.55);transition:transform .12s ease,box-shadow .12s ease;}
  .btn-chunky:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(76,29,149,.9),0 8px 14px -8px rgba(124,58,237,.55);}
</style>
</head>
<body class="min-h-screen relative">

<!-- ======================= SHARED SVG DEFS ======================= -->

<defs>

<!-- ======================= BACKGROUND DECOR ======================= -->
<div class="blob drift1 bg-emerald-300 w-[420px] h-[420px] -top-32 -right-24"></div>
<div class="blob drift2 bg-violet-300 w-[460px] h-[460px] -bottom-40 -left-28"></div>
<div class="blob drift1 bg-amber-200 w-[300px] h-[300px] top-1/3 left-1/2 opacity-40"></div>

<!-- ======================= HEADER ======================= -->
<header class="relative z-10 max-w-6xl mx-auto px-4 pt-6 pb-2 flex flex-col items-center gap-3">
  <div class="absolute right-3 top-4 flex gap-2">
    <button id="btnMute" aria-label="Toggle sound" class="w-11 h-11 rounded-2xl bg-white border-4 border-slate-200 shadow-md flex items-center justify-center text-slate-600 active:scale-90 transition-transform">
      <span id="icoSoundOn"><i data-lucide="volume-2" class="w-5 h-5"></i></span>
      <span id="icoSoundOff" class="hidden"><i data-lucide="volume-x" class="w-5 h-5"></i></span>
    </button>
  </div>

  <div class="text-center select-none">
    <span class="chip-title inline-block bg-gradient-to-r from-amber-400 to-orange-500 text-white text-sm sm:text-base font-bold tracking-[.3em] px-6 py-1.5 rounded-full border-4 border-white rotate-[-2deg]">FEED THE</span>
    <h1 class="title-lg font-bold mt-2" style="font-size:clamp(2.1rem,7.5vw,4.2rem)">
      <span class="stroke-green inline-block rotate-[-1.2deg]">SOUND</span>
      <span class="stroke-purple inline-block rotate-[1deg]">MONSTERS!</span>
    </h1>
  </div>

  <div class="flex items-center gap-2 bg-white/80 backdrop-blur border-4 border-white rounded-full px-5 py-2 shadow-lg text-slate-600 text-sm sm:text-base font-semibold">
    <i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i>
    <span>Drag each tasty word to the monster that loves its sound!</span>
  </div>

  <!-- Munch-o-meter -->
  <div class="flex items-center gap-3 bg-white/80 backdrop-blur rounded-full border-4 border-white shadow-lg pl-4 pr-5 py-2">
    <span class="text-xs font-bold tracking-widest text-slate-400 uppercase hidden sm:inline">Munch-o-meter</span>
    <div id="starsWrap" class="flex gap-1"></div>
    <span class="font-bold text-slate-600 text-sm"><span id="fedCount" class="inline-block text-emerald-600">0</span>/6</span>
  </div>
</header>

<!-- ======================= MONSTER STAGES ======================= -->
<main class="relative z-10 max-w-4xl mx-auto px-3 sm:px-6 pb-24">
  <section class="grid grid-cols-2 gap-3 sm:gap-8 items-start mt-6">

    <!-- ===== FRANKIE ===== -->
    <div id="stageFrankie" class="monster-stage rounded-[2rem] bg-gradient-to-b from-emerald-50/90 to-green-100/80 border-4 border-white shadow-xl px-2 sm:px-5 pt-8 pb-4" style="box-shadow:0 24px 40px -18px rgba(21,128,61,.35), inset 0 2px 0 #fff">
      <div id="tagFrankie" class="name-tag bg-gradient-to-br from-emerald-400 to-green-600 border-4 border-white text-white font-bold px-4 sm:px-6 py-1 rounded-full text-base sm:text-xl whitespace-nowrap">
        FRANKIE <span class="ml-1 text-emerald-100 text-xs sm:text-sm font-semibold bg-white/20 rounded-full px-2 py-0.5 align-middle">/f/</span>
      </div>
      <div class="ghost text-emerald-300/50" style="font-size:clamp(4.5rem,14vw,8.5rem)">/f/</div>
      <div class="relative mx-auto w-full max-w-[300px]">
        <svg id="svgFrankie" class="msvg" viewBox="0 0 400 400">
          <g id="frankieLean">
            <!-- arms -->
            <ellipse cx="80" cy="278" rx="24" ry="32" fill="#22C55E" transform="rotate(18 80 278)"/>
            <ellipse cx="320" cy="278" rx="24" ry="32" fill="#22C55E" transform="rotate(-18 320 278)"/>
            <!-- feet -->
            <ellipse cx="156" cy="352" rx="34" ry="16" fill="#16A34A"/>
            <ellipse cx="244" cy="352" rx="34" ry="16" fill="#16A34A"/>
            <!-- ears -->
            <g>
              <ellipse cx="148" cy="84" rx="25" ry="31" fill="url(#gFrankBody)" transform="rotate(-16 148 84)"/>
              <ellipse cx="147" cy="86" rx="12" ry="17" fill="#15803D" opacity=".45" transform="rotate(-16 147 86)"/>
              <ellipse cx="252" cy="84" rx="25" ry="31" fill="url(#gFrankBody)" transform="rotate(16 252 84)"/>
              <ellipse cx="253" cy="86" rx="12" ry="17" fill="#15803D" opacity=".45" transform="rotate(16 253 86)"/>
            </g>
            <!-- body -->
            <path d="M200 96 C148 96 112 124 98 168 C86 206 72 232 70 266 C68 306 96 338 140 348 C178 357 222 357 260 348 C304 338 332 306 330 266 C328 232 314 206 302 168 C288 124 252 96 200 96 Z"
                  fill="url(#gFrankBody)" filter="url(#fShadowGreen)"/>
            <!-- volume -->
            <g clip-path="url(#cFrankBody)">
              <ellipse cx="200" cy="352" rx="170" ry="80" fill="#14532D" opacity=".30" filter="url(#fBlur6)"/>
              <ellipse cx="148" cy="152" rx="100" ry="74" fill="#FFFFFF" opacity=".33" filter="url(#fBlur6)" transform="rotate(-18 148 152)"/>
              <ellipse cx="322" cy="262" rx="42" ry="112" fill="#15803D" opacity=".18" filter="url(#fBlur6)"/>
            </g>
            <!-- brows -->

            <rect x="234" y="116" width="46" height="10" rx="5" fill="#14532D" opacity=".8" transform="rotate(10 257 121)"/>
            <!-- eyes -->
            <g id="frankieEyes">
              <g class="eye-open" id="frankieEyeL">
                <ellipse class="sclera" cx="152" cy="168" rx="38" ry="40" fill="url(#gSclera)" stroke="#15803D" stroke-opacity=".25" stroke-width="3"/>
                <g id="fpL">
                  <circle cx="152" cy="173" r="15" fill="url(#gPupil)"/>
                  <circle cx="145" cy="164" r="6" fill="#fff"/>
                  <circle cx="159" cy="180" r="2.8" fill="#fff" opacity=".85"/>
                </g>
              </g>
              <g class="eye-open" id="frankieEyeR">
                <ellipse class="sclera" cx="248" cy="168" rx="38" ry="40" fill="url(#gSclera)" stroke="#15803D" stroke-opacity=".25" stroke-width="3"/>
                <g id="fpR">
                  <circle cx="248" cy="173" r="15" fill="url(#gPupil)"/>
                  <circle cx="241" cy="164" r="6" fill="#fff"/>
                  <circle cx="255" cy="180" r="2.8" fill="#fff" opacity=".85"/>
                </g>
              </g>
            </g>
            <!-- dizzy X eyes (hidden) -->
            <g id="frankieDizzy" opacity="0">
              <g id="fzL"><path d="M134 150 L170 186 M170 150 L134 186" stroke="#475569" stroke-width="10" stroke-linecap="round" fill="none"/></g>

            <!-- dizzy circling stars (hidden) -->
            <g id="frankieStars" opacity="0">

              <use href="#sparkStar" fill="#FDE047" stroke="#EAB308" stroke-width="1.5" transform="translate(276 102) scale(.8)"/>
            </g>
            <!-- cheeks -->
            <circle cx="102" cy="240" r="16" fill="#FDA4AF" opacity=".55" filter="url(#fBlur3)"/>
            <circle cx="298" cy="240" r="16" fill="#FDA4AF" opacity=".55" filter="url(#fBlur3)"/>
            <!-- MOUTH -->
            <g id="frankieMouthG">
              <path d="M112 268 C112 236 150 218 200 218 C250 218 288 236 288 268 C288 302 250 326 200 326 C150 326 112 302 112 268 Z"
                    fill="url(#gFrankMouth)" stroke="#15803D" stroke-width="7" stroke-linejoin="round"/>

<div id="win" class="fixed inset-0 z-[60] hidden items-center justify-center p-4" style="background:rgba(30,27,75,.55);backdrop-filter:blur(6px)">
  <div id="winPanel" class="relative bg-gradient-to-b from-white to-amber-50 rounded-[2.4rem] border-8 border-amber-200 px-6 sm:px-10 py-9 text-center max-w-sm w-full" style="box-shadow:0 40px 80px -20px rgba(30,27,75,.5), inset 0 3px 0 #fff">
    <div class="w-20 h-20 rounded-full bg-gradient-to-br from-amber-300 to-orange-500 border-4 border-white shadow-lg flex items-center justify-center mx-auto -mt-20 mb-3 rotate-[-6deg]">
      <i data-lucide="trophy" class="w-10 h-10 text-white"></i>
    </div>
    <h2 class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 via-sky-500 to-violet-600" style="font-size:clamp(2.2rem,8vw,3rem);line-height:1.05">AMAZING!</h2>
    <p class="mt-2 text-slate-600 font-semibold text-base sm:text-lg">You fed Frankie &amp; Theo every tasty sound!</p>
    <div id="winStars" class="flex justify-center gap-3 mt-4"></div>
    <button id="btnAgain" class="btn-chunky mt-7 inline-flex items-center gap-2.5 bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white font-bold text-xl px-9 py-3.5 rounded-full border-4 border-white">
      <i data-lucide="rotate-ccw" class="w-6 h-6"></i> PLAY AGAIN
    </button>
  </div>
</div>

<script>
/* ============================================================
   FEED THE SOUND MONSTERS — game engine
============================================================ */
const $  = q => document.querySelector(q);
const $$ = q => Array.from(document.querySelectorAll(q));
const SVGNS = "http://www.w3.org/2000/svg";
gsap.registerPlugin(Draggable);

/* ------------------- tiny synth SFX ------------------- */
const SFX = { on: true, ctx: null };
function ac(){
  if(!SFX.ctx){ try{ SFX.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SFX.ctx && SFX.ctx.state === "suspended") SFX.ctx.resume();
  return SFX.ctx;
}
document.addEventListener("pointerdown", ac, { once:true });
function tone({f=440,f2=null,dur=.12,type="sine",vol=.15,delay=0}){
  if(!SFX.on) return;
  if(!SFX.ctx) ac();
  if(!SFX.ctx) return;
  const t0 = SFX.ctx.currentTime + delay;
  const o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g).connect(SFX.ctx.destination);
  o.start(t0); o.stop(t0+dur+.06);
}
const sfx = {
  pop(){ tone({f:360,f2:640,dur:.08,type:"triangle",vol:.12}); },
  plop(){ tone({f:240,f2:120,dur:.14,type:"sine",vol:.12}); },
  nom(){ for(let i=0;i<4;i++) tone({f:200+(i%2)*46,f2:88,dur:.09,type:"square",vol:.09,delay:i*.11}); },
  yay(){ tone({f:660,dur:.09,type:"sine",vol:.1,delay:.02}); tone({f:880,dur:.12,type:"sine",vol:.1,delay:.12}); },
  buzz(){ tone({f:165,f2:70,dur:.26,type:"sawtooth",vol:.1}); tone({f:110,f2:60,dur:.3,type:"square",vol:.06,delay:.04}); },
  giggle(){ tone({f:520,f2:720,dur:.08,type:"triangle",vol:.1}); tone({f:640,f2:880,dur:.09,type:"triangle",vol:.1,delay:.09}); },
  win(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone({f,dur:.16,type:"triangle",vol:.13,delay:i*.1})); tone({f:1568,dur:.4,type:"sine",vol:.07,delay:.44}); }
};

/* ------------------- header stars ------------------- */
const STAR_SVG = `<svg viewBox="0 0 24 24" width="26" height="26" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
$("#starsWrap").innerHTML = Array.from({length:6},()=>`<span class="star-slot inline-block">${STAR_SVG}</span>`).join("");
const starSlots = $$("#starsWrap .star-slot");
$("#winStars").innerHTML = Array.from({length:3},()=>`<span class="inline-block"><svg viewBox="0 0 24 24" width="54" height="54" fill="#FBBF24" stroke="#D97708" stroke-width="1.4" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>`).join("");

/* ------------------- monster registry ------------------- */
const MONS = {
  frankie:{
    key:"frankie", lean:$("#frankieLean"), mouth:$("#frankieMouthG"),
    eyes:"#frankieEyeL, #frankieEyeR", pupils:"#fpL, #fpR",
    dizzy:$("#frankieDizzy"), dizzyBits:"#fzL, #fzR", stars:$("#frankieStars"),
    sweat:$("#frankieSweat"), zone:$("#zoneFrankie"), ring:$("#ringF"),
    tag:$("#tagFrankie"), mouthOrigin:"200 232", starsOrigin:"208 130",
    dizzyOrigins:["152 168","248 168"], color:"#059669", pop:"bg-emerald-500"
  },
  theo:{
    key:"theo", lean:$("#theoLean"), mouth:$("#theoMouthG"),
    eyes:"#theoEye", pupils:"#theoPupil",
    dizzy:$("#theoDizzy"), dizzyBits:"#theoDizzyCircles", stars:$("#theoStars"),
    sweat:$("#theoSweat"), zone:$("#zoneTheo"), ring:$("#ringT"),
    tag:$("#tagTheo"), mouthOrigin:"200 232", starsOrigin:"206 120",
    dizzyOrigins:["200 188"], color:"#9333EA", pop:"bg-violet-500"
  }
};
Object.values(MONS).forEach(M=>{
  gsap.set(M.mouth,{svgOrigin:M.mouthOrigin});
  gsap.set(M.lean,{svgOrigin:"200 352"});
  gsap.set(M.stars,{svgOrigin:M.starsOrigin});
});
gsap.set("#fzL",{svgOrigin:MONS.frankie.dizzyOrigins[0]});
gsap.set("#fzR",{svgOrigin:MONS.frankie.dizzyOrigins[1]});
gsap.set("#theoDizzyCircles",{svgOrigin:"200 188"});

/* ------------------- idle life: floating + blinking ------------------- */
gsap.to("#svgFrankie",{y:-5,duration:1.6,yoyo:true,repeat:-1,ease:"sine.inOut"});
gsap.to("#svgTheo",{y:-5,duration:1.6,yoyo:true,repeat:-1,ease:"sine.inOut",delay:.8});

let chewing = false;
function blink(){
  gsap.timeline()
    .to(".eye-open",{scaleY:.06,duration:.07,ease:"power1.in"})
    .to(".eye-open",{scaleY:1,duration:.16,ease:"back.out(2.4)"});
}
(function scheduleBlink(){
  setTimeout(()=>{ if(!chewing) blink(); scheduleBlink(); }, 2200 + Math.random()*3000);
})();

/* idle pupil wander */
(function wander(){
  setTimeout(()=>{
    if(!dragging){
      const dx = gsap.utils.random(-3.4,3.4), dy = gsap.utils.random(-2.4,2.4);
      gsap.to("#fpL, #fpR, #theoPupil",{x:dx,y:dy,duration:.45,ease:"sine.inOut"});
    }
    wander();
  }, 1700 + Math.random()*2400);
})();

/* ------------------- floating text pops ------------------- */
function popText(x,y,txt,classes){
  const d = document.createElement("div");
  d.className = `poptxt ${classes}`; d.textContent = txt;
  d.style.left = x+"px"; d.style.top = y+"px";
  document.body.appendChild(d);
  gsap.timeline({onComplete:()=>d.remove()})
    .fromTo(d,{scale:0,rotation:gsap.utils.random(-10,10),xPercent:-50,yPercent:-50},
             {scale:1,duration:.32,ease:"back.out(2.6)"})
    .to(d,{y:-46,duration:.7,ease:"power1.out"},"<")
    .to(d,{opacity:0,scale:.7,duration:.25},"-=.25");
}
const YUMS = ["Yum!","Tasty!","Mmm!","So good!","More please!"];
const OOPS = ["Oops!","Not my sound!","Try again!"];

/* ------------------- crumb particles ------------------- */
const PALETTES = {
  FRIES:["#F59E0B","#FDE047","#EF4444"], MUFFIN:["#D97706","#6366F1","#FBBF24"],
  FUDGE:["#B45309","#92400E","#FDE68A"], THREE:["#F472B6","#34D399","#FDE68A"],
  SMOOTHIE:["#C084FC","#F0ABFC","#FDE68A"], BROTH:["#FBBF24","#FB923C","#38BDF8"]
};
function crumbsAt(cx,cy,palette){
  const fx = $("#fx");
  for(let i=0;i<15;i++){
    const useRect = i%3===0;
    const el = document.createElementNS(SVGNS, useRect ? "rect" : "circle");
    const col = palette[i % palette.length];
    if(useRect){
      const s = gsap.utils.random(7,13);
      el.setAttribute("x",-s/2); el.setAttribute("y",-s/2);
      el.setAttribute("width",s); el.setAttribute("height",s); el.setAttribute("rx",3);
    } else el.setAttribute("r", gsap.utils.random(4,8));
    el.setAttribute("fill", col);
    fx.appendChild(el);
    const side = i%2===0 ? -1 : 1;
    const ang = gsap.utils.random(-.7,.7);
    const dist = gsap.utils.random(55,150);
    gsap.set(el,{x:cx,y:cy,scale:gsap.utils.random(.7,1.2)});
    gsap.to(el,{
      x: cx + side*Math.cos(ang)*dist,
      y: cy + Math.sin(ang)*dist*.6 - gsap.utils.random(10,60),
      rotation: gsap.utils.random(-220,220),
      scale:.15, opacity:0, duration:gsap.utils.random(.65,1.05), ease:"power2.out",
      onComplete:()=>el.remove()
    });
  }
}

/* ------------------- hover (drag-over) states ------------------- */
let hovered = null, dragging = false;
function hoverEnter(key){
  const M = MONS[key];
  if(M._chewing) return;
  gsap.to(M.mouth,{scaleX:1.25,scaleY:1.25,duration:.5,ease:"elastic.out(1.2,0.4)"});
  gsap.to(M.lean,{rotation:key==="frankie"?4:-4,y:6,scale:1.03,duration:.7,ease:"elastic.out(1,0.45)"});
  M.ring.classList.add("hot");
  gsap.fromTo(M.tag,{rotation:key==="frankie"?-2:2},{rotation:key==="frankie"?-5:5,duration:.4,ease:"elastic.out(2,.4)"});
}
function hoverExit(key){
  const M = MONS[key];
  if(M._chewing) return;
  gsap.to(M.mouth,{scaleX:1,scaleY:1,duration:.45,ease:"back.out(2.2)"});
  gsap.to(M.lean,{rotation:0,y:0,scale:1,duration:.6,ease:"elastic.out(1,0.5)"});
  M.ring.classList.remove("hot");
  gsap.to(M.tag,{rotation:key==="frankie"?-2:2,duration:.4,ease:"elastic.out(2,.4)"});
}
function setHover(key){
  if(hovered === key) return;
  if(hovered) hoverExit(hovered);
  hovered = key;
  if(key) hoverEnter(key);
}

/* pupils follow the dragged card */
function pupilsFollow(px,py){
  for(const M of Object.values(MONS)){
    if(M._chewing) continue;
    const r = M.lean.getBoundingClientRect();
    const cx = r.left + r.width*.5, cy = r.top + r.height*.42;
    const dx = gsap.utils.clamp(-6,6,(px-cx)/16), dy = gsap.utils.clamp(-4,4,(py-cy)/16);
    gsap.to(M.pupils,{x:dx,y:dy,duration:.25,ease:"power1.out",overwrite:"auto"});
  }
}
function pupilsReset(){
  gsap.to("#fpL, #fpR, #theoPupil",{x:0,y:0,duration:.5,ease:"elastic.out(1,.5)"});
}

/* ------------------- juicy chewing ------------------- */
function chew(key){
  const M = MONS[key];
  M._chewing = true; chewing = true;
  gsap.timeline({onComplete:()=>{ M._chewing=false; chewing=false; }})
    .set(M.mouth,{scaleX:1,scaleY:1})
    .to(M.mouth,{keyframes:{
        scaleY:[0.32,1.14,0.3,1.14,0.3,1.14,0.3,1],
        scaleX:[1.12,0.98,1.12,0.98,1.12,0.98,1.1,1]},
        duration:.85,ease:"sine.inOut"},0)
    /* happy squinting eyes */
    .to(M.eyes,{scaleY:.5,duration:.1,transformOrigin:"50% 50%"},0)
    .to(M.eyes,{scaleY:1,duration:.28,ease:"back.out(3)"},.62)
    .add(()=>sfx.yay(),.5)
    /* little celebratory bounce */
    .to(M.lean,{y:-16,duration:.18,ease:"power2.out"},.68)
    .to(M.lean,{y:0,duration:.55,ease:"bounce.out"},.86);
}

/* ------------------- dizzy / wrong reaction ------------------- */
function dizzy(key, cardEl){
  const M = MONS[key];
  M._chewing = true; chewing = true;
  sfx.buzz();
  const other = key==="frankie" ? "theo" : "frankie";
  const tl = gsap.timeline({onComplete:()=>{ M._chewing=false; chewing=false; }});
  tl.set(M.dizzy,{opacity:1},0).set(M.pupils,{opacity:0},0);
  /* violent 500ms horizontal shake */
  tl.to(M.lean,{keyframes:{
      x:[-10,10,-9,9,-7,7,-4,4,0],
      rotation:[-2.5,2.5,-2.5,2.5,-1.5,1.5,-1,1,0]},
      duration:.5,ease:"sine.inOut"},0);
  /* dizzy eye spin / wiggle */
  if(key==="theo") tl.fromTo("#theoDizzyCircles",{rotation:0},{rotation:720,duration:.85,ease:"power1.out"},0);
  else tl.to(M.dizzyBits,{keyframes:{rotation:[-14,14,-10,10,0]},duration:.5,ease:"sine.inOut"},0);
  /* circling stars */
  tl.fromTo(M.stars,{opacity:0,rotation:0},{opacity:1,rotation:540,duration:1.05,ease:"none"},0)
    .to(M.stars,{opacity:0,duration:.2},.85);
  /* sweat drops, two bead drops */
  tl.fromTo(M.sweat,{opacity:0,y:-8,scale:.5,transformOrigin:"50% 50%"},
                   {opacity:1,y:12,scale:1,duration:.3,ease:"power1.in"},.1)
    .to(M.sweat,{opacity:0,y:24,duration:.22},.42)
    .fromTo(M.sweat,{opacity:0,y:-8,scale:.5},
                   {opacity:1,y:14,scale:1,duration:.28,ease:"power1.in"},.55)
    .to(M.sweat,{opacity:0,duration:.2},.85);
  /* restore normal eyes + blink */
  tl.set(M.dizzy,{opacity:0},.9).set(M.pupils,{opacity:1},.9)
    .add(()=>blink(),.95);

  /* return card to tray */
  gsap.to(cardEl,{x:0,y:0,scale:1,rotation:0,duration:.6,ease:"elastic.out(1.1,.5)"});
  const r = M.zone.getBoundingClientRect();
  popText(r.left+r.width/2, r.top-34, OOPS[Math.floor(Math.random()*OOPS.length)], "bg-rose-500");
  /* scaffolding: flash the correct monster's mouth ring */
  const correctKey = cardEl.dataset.target;
  setTimeout(()=>{
    if(!MONS[correctKey]._chewing){
      hoverEnter(correctKey);
      setTimeout(()=>{ if(hovered!==correctKey) hoverExit(correctKey); }, 600);
    }
  }, 700);
}

/* ------------------- progress / win ------------------- */
let fed = 0;
const TOTAL = 6;
function fillStar(i){
  const s = starSlots[i];
  s.classList.add("filled");
  gsap.fromTo(s,{scale:.3,rotation:-120},{scale:1,rotation:0,duration:.55,ease:"back.out(3)"});
  const r = s.getBoundingClientRect();
  confetti({particleCount:22, spread:55, scalar:.6, ticks:70,
    origin:{x:(r.left+r.width/2)/innerWidth, y:(r.top+r.height/2)/innerHeight},
    colors:["#FBBF24","#FDE047","#F59E0B"]});
  $("#fedCount").textContent = fed;
  gsap.fromTo("#fedCount",{scale:1.6},{scale:1,duration:.4,ease:"back.out(2)"});
}
function checkWin(){ if(fed === TOTAL) setTimeout(win, 1000); }
function win(){
  sfx.win();
  const C = ["#22C55E","#A855F7","#FBBF24","#F472B6","#38BDF8","#F97316"];
  confetti({particleCount:100,spread:75,origin:{y:.6},colors:C});
  setTimeout(()=>confetti({particleCount:60,angle:60,spread:60,origin:{x:0,y:.7},colors:C}),250);
  setTimeout(()=>confetti({particleCount:60,angle:120,spread:60,origin:{x:1,y:.7},colors:C}),420);
  setTimeout(()=>confetti({particleCount:150,spread:110,origin:{y:.4},scalar:1.1,colors:C}),650);
  /* happy monster dance */
  gsap.to("#frankieLean, #theoLean",{y:-18,duration:.22,yoyo:true,repeat:5,ease:"power1.inOut",stagger:.08});
  const w = $("#win");
  w.classList.remove("hidden"); w.classList.add("flex");
  gsap.fromTo("#winPanel",{scale:.5,rotation:-7,opacity:0,y:40},
    {scale:1,rotation:0,opacity:1,y:0,duration:.7,ease:"elastic.out(1,.5)"});
  gsap.fromTo("#winStars > span",{scale:0,rotation:-40},
    {scale:1,rotation:0,stagger:.16,delay:.25,duration:.6,ease:"back.out(2.6)"});
  gsap.fromTo("#win",{opacity:0},{opacity:1,duration:.25});
}

/* ------------------- tray helpers ------------------- */
function shuffleTray(){
  const tray = $("#tray");
  const cards = Array.from(tray.children);
  for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }
  cards.forEach(c=>tray.appendChild(c));
}

/* ------------------- drag & drop engine ------------------- */
const draggables = Draggable.create(".food-card",{
  type:"x,y",
  onPress(){
    dragging = true;
    this.target.classList.add("dragging");
    sfx.pop();
    gsap.to(this.target,{scale:1.1,rotation:gsap.utils.random(-4,4),duration:.18,ease:"power2.out"});
  },
  onDrag(){
    pupilsFollow(this.pointerX,this.pointerY);
    const hitF = this.hitTest("#zoneFrankie","40%");
    const hitT = this.hitTest("#zoneTheo","40%");
    setHover(hitF ? "frankie" : hitT ? "theo" : null);
  },
  onRelease(){
    this.target.classList.remove("dragging");
    if(!this.isDragging){
      /* simple tap, not a drag — settle the card back */
      dragging = false;
      gsap.to(this.target,{scale:1,rotation:0,duration:.3,ease:"power2.out"});
    }
  },
  onDragEnd(){
    const card = this.target, target = hovered;
    dragging = false;
    pupilsReset();
    setHover(null);
    if(target && card.dataset.target === target) correctDrop(this, target);
    else if(target) dizzy(target, card);
    else { gsap.to(card,{x:0,y:0,scale:1,rotation:0,duration:.6,ease:"elastic.out(1,.6)"}); sfx.plop(); }
  }
});

function correctDrop(d, key){
  const card = d.target, M = MONS[key];
  d.disable(); card.classList.remove("dragging");
  const zr = M.zone.getBoundingClientRect();
  const cx = zr.left + zr.width/2, cy = zr.top + zr.height*.4;
  const cr = card.getBoundingClientRect();
  const nx = gsap.getProperty(card,"x") + (cx - (cr.left+cr.width/2));
  const ny = gsap.getProperty(card,"y") + (cy - (cr.top+cr.height/2));
  gsap.timeline()
    .to(card,{x:nx,y:ny,scale:.12,rotation:gsap.utils.random(-50,50),duration:.3,ease:"power2.in"})
    .add(()=>{
      card.style.display = "none";
      sfx.nom(); chew(key);
      crumbsAt(cx,cy,PALETTES[card.dataset.word]||["#FBBF24"]);
      fed++; fillStar(fed-1);
      popText(cx, zr.top-26, YUMS[Math.floor(Math.random()*YUMS.length)], M.pop);
      gsap.fromTo(M.tag,{scale:1},{scale:1.16,duration:.12,yoyo:true,repeat:1});
      checkWin();
    },"-=.02");
}

/* giggle when kids poke a monster */
[["#svgFrankie","frankie"],["#svgTheo","theo"]].forEach(([sel,key])=>{
  $(sel).style.pointerEvents = "auto";
  $(sel).addEventListener("pointerdown",()=>{
    const M = MONS[key];
    if(M._chewing || dragging) return;
    sfx.giggle();
    gsap.timeline()
      .to(M.lean,{scaleY:.92,scaleX:1.06,duration:.12})
      .to(M.lean,{scaleY:1.05,scaleX:.96,y:-10,duration:.16})
      .to(M.lean,{scaleY:1,scaleX:1,y:0,duration:.5,ease:"elastic.out(1,.4)"});
  });
});

/* ------------------- reset / play again ------------------- */
function resetGame(){
  gsap.to("#win",{opacity:0,duration:.3,onComplete:()=>{
    $("#win").classList.add("hidden"); $("#win").classList.remove("flex");
  }});
  fed = 0; $("#fedCount").textContent = 0;
  starSlots.forEach(s=>{ s.classList.remove("filled"); gsap.set(s,{scale:1,rotation:0}); });
  shuffleTray();
  $$(".food-card").forEach((c,i)=>{
    c.style.display = "";
    gsap.set(c,{x:0,y:0,scale:1,rotation:0,opacity:1});
  });
  draggables.forEach(d=>d.enable());
  gsap.fromTo(".food-card",
    {scale:.4,opacity:0,y:26},
    {scale:1,opacity:1,y:0,duration:.5,ease:"back.out(2)",stagger:.06,delay:.35,clearProps:"scale,opacity"});
}
$("#btnAgain").addEventListener("click", resetGame);

/* ------------------- mute toggle ------------------- */
$("#btnMute").addEventListener("click",()=>{
  SFX.on = !SFX.on;
  if(SFX.on) ac();
  $("#icoSoundOn").classList.toggle("hidden",!SFX.on);
  $("#icoSoundOff").classList.toggle("hidden",SFX.on);
  gsap.fromTo("#btnMute",{scale:.85},{scale:1,duration:.3,ease:"back.out(3)"});
});

/* ------------------- intro ------------------- */
lucide.createIcons();
shuffleTray();
const intro = gsap.timeline();
intro.fromTo("header > *",{y:-30,opacity:0},{y:0,opacity:1,duration:.6,ease:"power2.out",stagger:.1})
     .fromTo("#stageFrankie",{y:70,opacity:0,scale:.85},{y:0,opacity:1,scale:1,duration:.7,ease:"back.out(1.6)"},"-=.3")
     .fromTo("#stageTheo",{y:70,opacity:0,scale:.85},{y:0,opacity:1,scale:1,duration:.7,ease:"back.out(1.6)"},"-=.5")
     .fromTo(".food-card",{scale:.3,opacity:0,y:40},{scale:1,opacity:1,y:0,duration:.55,ease:"back.out(2)",stagger:.07},"-=.4")
     .add(()=>blink(), "+=.3");
</script>
</body>
</html>
