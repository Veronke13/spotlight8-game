<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b6ec2">
<title>ABC Safari — Spotlight 2 Alphabet Adventure</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ABC SAFARI — Spotlight 2 | Core Stylesheet
     Design space: 1600 x 900 (16:9), scaled via JS transform.
     ============================================================ */
  :root{
    --sun:#ffc93c; --sun-d:#f0a500; --grass:#58b368; --grass-d:#3d8b4f;
    --sky:#4fc3f7; --sky-d:#2196d3; --coral:#ff8a65; --coral-d:#e2603a;
    --grape:#ab7bdc; --grape-d:#8b5cc2; --cream:#fff8e7; --ink:#4a3627;
    --stage-w:1600px; --stage-h:900px;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#10243e; font-family:'Fredoka','Comic Sans MS','Chalkboard SE',sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    touch-action:manipulation;
  }
  img{ -webkit-user-drag:none; user-select:none; }
  #viewport{
    position:fixed; inset:0; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 10%, #2b5c8f 0%, #16324f 55%, #0c1d33 100%);
    touch-action:none;
  }
  #stage{
    position:absolute; left:50%; top:50%; width:var(--stage-w); height:var(--stage-h);
    transform-origin:center center; overflow:hidden; border-radius:0;
    user-select:none; -webkit-user-select:none;
  }
  .view{ position:absolute; inset:0; display:none; }
  .view.active{ display:block; animation:viewFade .45s ease both; }
  @keyframes viewFade{ from{opacity:0; transform:scale(1.02);} to{opacity:1; transform:scale(1);} }

  .bg-layer{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .bg-fallback{ position:absolute; inset:0; z-index:-1;
    background:linear-gradient(180deg,#7ec8f7 0%,#aee3ff 45%,#8fd694 100%); }

  .tap{ cursor:pointer; transition:transform .14s cubic-bezier(.34,1.56,.64,1), filter .2s ease; }
  .tap:hover{ transform:scale(1.05); filter:brightness(1.06); }
  .tap:active{ transform:scale(.93); filter:brightness(.98); }

  /* ---------------- LOADER ---------------- */
  #loader{ position:fixed; inset:0; z-index:999; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:24px;
    background:radial-gradient(120% 120% at 50% 20%, #2b6cb0 0%, #173a5e 70%);
    transition:opacity .6s ease; }
  #loader.done{ opacity:0; pointer-events:none; }
  .load-badge{ width:120px; height:120px; border-radius:50%;
    background:conic-gradient(from 0deg,#ffc93c,#ff8a65,#ab7bdc,#4fc3f7,#58b368,#ffc93c);
    animation:spin 1.6s linear infinite; display:flex; align-items:center; justify-content:center; }
  .load-badge::after{ content:""; width:96px; height:96px; border-radius:50%; background:#173a5e; }
  .load-badge span{ position:absolute; font-size:52px; font-weight:700; color:#fff; animation:spinBack 1.6s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  @keyframes spinBack{ to{ transform:rotate(-360deg);} }
  #loader p{ color:#eaf6ff; font-size:24px; font-weight:600; letter-spacing:.06em; }

  /* ---------------- MAIN MENU ---------------- */
  #view-menu{ }
  .menu-title{
    position:absolute; top:60px; left:0; right:0; text-align:center; z-index:5;
    font-size:128px; font-weight:700; letter-spacing:.02em; line-height:.95;
    background:linear-gradient(180deg,#fff176 10%,#ffc93c 45%,#ff8a3c 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 0 rgba(120,53,15,.55)) drop-shadow(0 14px 22px rgba(0,0,0,.35));
    animation:titleFloat 3.4s ease-in-out infinite;
  }
  @keyframes titleFloat{ 0%,100%{ transform:translateY(0) rotate(-1deg);} 50%{ transform:translateY(-14px) rotate(1deg);} }
  .menu-sub{ position:absolute; top:225px; left:0; right:0; text-align:center; z-index:5;
    font-size:36px; font-weight:600; color:#fff; text-shadow:0 3px 0 rgba(21,83,145,.8), 0 6px 14px rgba(0,0,0,.3);
    letter-spacing:.18em; }
  #btn-play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-34%); z-index:6;
    width:330px; height:330px; border:none; background:transparent; padding:0;
    animation:playPulse 1.8s ease-in-out infinite; filter:drop-shadow(0 16px 26px rgba(0,0,0,.35)); }
  #btn-play img{ width:100%; height:100%; object-fit:contain; }
  @keyframes playPulse{ 0%,100%{ transform:translate(-50%,-34%) scale(1); filter:drop-shadow(0 0 0 rgba(255,220,90,.0)) drop-shadow(0 16px 26px rgba(0,0,0,.35)); }
    50%{ transform:translate(-50%,-34%) scale(1.06); filter:drop-shadow(0 0 34px rgba(255,220,90,.85)) drop-shadow(0 16px 26px rgba(0,0,0,.35)); } }
  #btn-play:active{ animation:none; transform:translate(-50%,-34%) scale(.92); }
  .play-label{ position:absolute; left:50%; top:calc(50% + 158px); transform:translateX(-50%); z-index:6;
    font-size:44px; font-weight:700; color:#fff; letter-spacing:.14em;
    text-shadow:0 4px 0 rgba(21,83,145,.85), 0 8px 18px rgba(0,0,0,.35); }
  .menu-foot{ position:absolute; bottom:26px; left:0; right:0; text-align:center; z-index:5;
    color:#dff1ff; font-size:22px; font-weight:500; opacity:.9; text-shadow:0 2px 6px rgba(0,0,0,.4); }
  .float-letter{ position:absolute; z-index:2; font-weight:700; color:rgba(255,255,255,.55);
    text-shadow:0 4px 14px rgba(0,0,0,.25); animation:driftY linear infinite; }
  @keyframes driftY{ from{ transform:translateY(1080px) rotate(-12deg);} to{ transform:translateY(-160px) rotate(14deg);} }

  /* sound toggle (shared) */
  .snd-btn{ position:absolute; width:104px; height:104px; z-index:80; border:none; background:transparent; padding:8px;
    border-radius:32px; background:rgba(10,40,70,.35); backdrop-filter:blur(4px);
    box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25); }
  .snd-btn img{ width:100%; height:100%; object-fit:contain; }
  .snd-menu{ top:30px; right:30px; }

  /* ---------------- LEVEL MAP ---------------- */
  .map-title{ position:absolute; top:26px; left:0; right:0; text-align:center; z-index:6;
    font-size:64px; font-weight:700; color:#fff; letter-spacing:.06em;
    text-shadow:0 5px 0 rgba(21,83,145,.8), 0 10px 22px rgba(0,0,0,.35); }
  #map-path{ position:absolute; inset:0; width:100%; height:100%; z-index:2; }
  .map-node{ position:absolute; z-index:5; width:250px; transform:translate(-50%,-50%); }
  .map-node .node-img{ width:100%; height:auto; display:block; filter:drop-shadow(0 14px 20px rgba(0,0,0,.4)); transition:filter .3s ease; }
  .map-node.unlocked .node-img{ animation:nodeBob 2.6s ease-in-out infinite; }
  @keyframes nodeBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-12px);} }
  .node-badge{ position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    min-width:64px; height:64px; padding:0 20px; border-radius:40px; z-index:6;
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; color:#fff;
    background:linear-gradient(180deg,#ffb340,#ff8a3c); box-shadow:0 6px 0 #c2571b, 0 10px 18px rgba(0,0,0,.3); }
  .node-name{ position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%);
    white-space:nowrap; font-size:26px; font-weight:700; color:#fff; letter-spacing:.04em;
    text-shadow:0 3px 0 rgba(21,83,145,.85), 0 5px 12px rgba(0,0,0,.4);
    background:rgba(16,60,105,.55); padding:8px 18px; border-radius:24px; }
  .node-stars{ position:absolute; top:-64px; left:50%; transform:translateX(-50%); display:flex; gap:4px; z-index:6; }
  .node-stars img{ width:42px; height:42px; }
  .map-node.locked{ cursor:not-allowed; }
  .map-node.locked .node-img{ filter:grayscale(1) brightness(.72) drop-shadow(0 14px 20px rgba(0,0,0,.4)); }
  .lock-overlay{ position:absolute; top:50%; left:50%; width:120px; height:120px;
    transform:translate(-50%,-50%); z-index:6; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45)); pointer-events:none; }
  .map-node.just-unlocked .lock-overlay{ animation:lockBreak .7s ease forwards; }
  @keyframes lockBreak{ 40%{ transform:translate(-50%,-50%) scale(1.3) rotate(-8deg); opacity:1;} 100%{ transform:translate(-50%,-120%) scale(1.5) rotate(20deg); opacity:0;} }
  .map-home{ position:absolute; top:30px; left:30px; z-index:80; width:104px; height:104px;
    border-radius:32px; border:none; background:rgba(10,40,70,.35); backdrop-filter:blur(4px);
    box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center; }
  .map-home svg{ width:58px; height:58px; }

  /* ---------------- HUD (gameplay top bar) ---------------- */
  #hud{ position:absolute; top:0; left:0; right:0; height:118px; z-index:60; display:none;
    align-items:center; padding:14px 26px; gap:18px;
    background:linear-gradient(180deg, rgba(9,38,66,.72), rgba(9,38,66,.28) 78%, rgba(9,38,66,0));
    pointer-events:none; }
  #hud.active{ display:flex; }
  #hud > *{ pointer-events:auto; }
  .hud-btn{ width:88px; height:88px; border-radius:28px; border:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#ffffff,#dbe9ff); box-shadow:0 6px 0 #9fb9dd, 0 10px 18px rgba(0,0,0,.28); }
  .hud-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #9fb9dd, 0 6px 12px rgba(0,0,0,.28); }
  .hud-btn svg{ width:48px; height:48px; }
  .hud-ribbon{ margin-left:10px; padding:14px 30px; border-radius:26px;
    font-size:30px; font-weight:700; color:#fff; letter-spacing:.05em;
    background:linear-gradient(180deg,#ffb340,#ff8a3c); box-shadow:0 6px 0 #c2571b, 0 10px 18px rgba(0,0,0,.28);
    text-shadow:0 2px 0 rgba(160,60,10,.6); }
  .hud-progress{ margin-left:auto; display:flex; align-items:center; gap:10px;
    padding:12px 22px; border-radius:30px; background:rgba(9,38,66,.5); backdrop-filter:blur(4px);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.2); }
  .hud-progress img{ width:52px; height:52px; transition:transform .2s ease; }
  .hud-progress img.earned{ animation:starPop .5s cubic-bezier(.34,1.8,.64,1) both; }
  @keyframes starPop{ 0%{ transform:scale(.2) rotate(-40deg);} 70%{ transform:scale(1.35) rotate(8deg);} 100%{ transform:scale(1) rotate(0);} }

  /* ---------------- TASK BANNER (INTRO substate) ---------------- */
  #task-banner{ position:absolute; top:150px; left:50%; transform:translate(-50%,-260px) scale(.7);
    z-index:70; opacity:0; pointer-events:none;
    padding:26px 66px; border-radius:44px; text-align:center;
    background:linear-gradient(180deg,#67c96f,#3d8b4f); box-shadow:0 8px 0 #2c6e3b, 0 18px 34px rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.4);
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; }
  #task-banner.show{ transform:translate(-50%,0) scale(1); opacity:1; }
  #task-banner .tb-title{ font-size:52px; font-weight:700; color:#fff; letter-spacing:.05em; text-shadow:0 3px 0 rgba(30,90,40,.7); }
  #task-banner .tb-sub{ font-size:26px; font-weight:600; color:#eaffe9; opacity:.95; margin-top:2px; }

  /* ---------------- LEVEL 1 : SOUND ECHO ---------------- */
  .l1-wrap{ position:absolute; inset:0; z-index:10; }
  .word-card{ position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:940px; height:530px; }
  .word-card .frame-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; z-index:1; }
  .word-card .card-inner{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center;
    padding:52px 120px; gap:30px; }
  .word-card.enter{ animation:cardEnter .6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes cardEnter{ 0%{ transform:translate(-50%,-50%) scale(.5) rotate(-6deg); opacity:0;} 100%{ transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1;} }
  .word-card.shake{ animation:shakeX .5s ease; }
  @keyframes shakeX{ 0%,100%{ transform:translate(-50%,-50%); } 20%{ transform:translate(calc(-50% - 18px),-50%);} 40%{ transform:translate(calc(-50% + 16px),-50%); } 60%{ transform:translate(calc(-50% - 10px),-50%); } 80%{ transform:translate(calc(-50% + 8px),-50%); } }
  .l1-letter{ font-size:150px; font-weight:700; color:#ff7a3c; text-shadow:0 5px 0 rgba(255,255,255,.9), 0 10px 18px rgba(0,0,0,.18); line-height:1; }
  .l1-right{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .l1-pic{ width:300px; height:300px; object-fit:contain; filter:drop-shadow(0 10px 16px rgba(0,0,0,.2)); }
  .l1-word{ font-size:58px; font-weight:700; color:#3a7bd5; letter-spacing:.04em; text-transform:lowercase; }
  .mic-badge{ position:absolute; right:44px; bottom:34px; z-index:3; width:104px; height:104px; border-radius:50%;
    background:linear-gradient(180deg,#ff9db1,#ef5b78); box-shadow:0 6px 0 #c23a55, 0 12px 22px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; }
  .mic-badge svg{ width:56px; height:56px; }
  .mic-badge.pulsing::after{ content:""; position:absolute; inset:-14px; border-radius:50%;
    border:6px solid rgba(255,120,150,.75); animation:pulseRing 1.3s ease-out infinite; }
  @keyframes pulseRing{ 0%{ transform:scale(.7); opacity:1;} 100%{ transform:scale(1.35); opacity:0;} }
  .next-btn{ position:absolute; right:70px; bottom:56px; z-index:20; width:150px; height:120px; border:none;
    border-radius:34px; background:linear-gradient(180deg,#7ddf8a,#3d8b4f);
    box-shadow:0 8px 0 #2c6e3b, 0 16px 26px rgba(0,0,0,.32), inset 0 3px 0 rgba(255,255,255,.45);
    display:flex; align-items:center; justify-content:center; animation:nextNudge 1.4s ease-in-out infinite; }
  .next-btn svg{ width:72px; height:72px; }
  @keyframes nextNudge{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(12px);} }
  .next-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 #2c6e3b; }
  .hint-line{ position:absolute; left:0; right:0; bottom:26px; text-align:center; z-index:15;
    font-size:28px; font-weight:600; color:#fff; text-shadow:0 3px 0 rgba(21,83,145,.8), 0 6px 14px rgba(0,0,0,.3); }

  /* ---------------- LEVEL 2 : PHOTO SAFARI ---------------- */
  .l2-card{ position:absolute; left:50%; top:340px; transform:translate(-50%,-50%); width:780px; height:440px; }
  .l2-card .card-inner{ padding:46px 110px; display:flex; align-items:center; justify-content:center; gap:24px; }
  .l2-pic{ width:290px; height:290px; object-fit:contain; filter:drop-shadow(0 10px 16px rgba(0,0,0,.2)); }
  .speaker-btn{ width:96px; height:96px; border:none; border-radius:50%; flex:none;
    background:linear-gradient(180deg,#79c9ff,#2196d3); box-shadow:0 6px 0 #166da0, 0 12px 22px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; }
  .speaker-btn svg{ width:52px; height:52px; }
  .monster-row{ position:absolute; left:0; right:0; bottom:34px; z-index:12; display:flex; justify-content:space-between; padding:0 130px; }
  .monster{ position:relative; width:430px; height:360px; }
  .monster .m-img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 14px 20px rgba(0,0,0,.35)); }
  .monster .m-tag{ position:absolute; top:6px; left:50%; transform:translateX(-50%);
    width:58px; height:58px; border-radius:50%; background:linear-gradient(180deg,#ffd968,#ff9d3c);
    display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; color:#7a3b00;
    box-shadow:0 4px 0 #c26a12, 0 8px 14px rgba(0,0,0,.28); }
  .monster .m-word{ position:absolute; left:50%; bottom:38px; transform:translateX(-50%);
    font-size:52px; font-weight:700; color:#fff; letter-spacing:.03em; white-space:nowrap;
    text-shadow:0 3px 0 rgba(60,20,90,.85), 0 6px 12px rgba(0,0,0,.4);
    background:rgba(40,16,80,.5); padding:10px 30px; border-radius:30px; }
  .monster.shake{ animation:shakeSm .5s ease; }
  @keyframes shakeSm{ 0%,100%{ transform:translateX(0);} 20%{ transform:translateX(-16px);} 40%{ transform:translateX(14px);} 60%{ transform:translateX(-9px);} 80%{ transform:translateX(7px);} }
  .map-node.shake .node-img{ animation:shakeSm .5s ease; }
  .monster.jump .m-img{ animation:monJump .7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes monJump{ 0%{ transform:translateY(0) scale(1);} 35%{ transform:translateY(-46px) scale(1.06);} 60%{ transform:translateY(0) scale(.97);} 100%{ transform:translateY(0) scale(1);} }
  .monster.win-glow::after{ content:""; position:absolute; inset:-26px; border-radius:50%; pointer-events:none;
    border:8px solid rgba(255,220,90,.9); animation:pulseRing 1s ease-out infinite; }

  /* ---------------- LEVEL 3 : BUBBLE POPPER ---------------- */
  .l3-card{ position:absolute; left:50%; top:330px; transform:translate(-50%,-50%); width:940px; height:530px; }
  .l3-card .card-inner{ padding:48px 100px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .l3-pic{ width:190px; height:190px; object-fit:contain; filter:drop-shadow(0 8px 14px rgba(0,0,0,.2)); }
  .word-slots{ display:flex; gap:14px; align-items:center; justify-content:center; margin-top:6px; }
  .w-tile{ min-width:76px; height:96px; padding:0 10px; border-radius:22px; display:flex; align-items:center; justify-content:center;
    font-size:62px; font-weight:700; color:#4a3627;
    background:linear-gradient(180deg,#ffffff,#e9f2ff); box-shadow:0 6px 0 #b9cbe8, 0 10px 16px rgba(0,0,0,.18); }
  .w-tile.blank{ background:rgba(255,255,255,.35); box-shadow:inset 0 4px 10px rgba(30,80,140,.35);
    border:5px dashed rgba(255,255,255,.95); color:transparent; }
  .w-tile.filled-flash{ animation:slotGold .8s ease both; }
  @keyframes slotGold{ 0%{ background:linear-gradient(180deg,#fff3b0,#ffd54a); transform:scale(1.25) rotate(-4deg); color:#8a5b00;}
    60%{ transform:scale(.95);} 100%{ background:linear-gradient(180deg,#ffffff,#fff3c4); transform:scale(1); color:#4a3627;} }
  .bubble-zone{ position:absolute; left:0; right:0; bottom:0; height:320px; z-index:12; }
  .bubble-pos{ position:absolute; bottom:30px; width:220px; height:240px; transform:translateX(-50%); }
  .bubble-floater{ width:100%; height:100%; animation:floatY var(--fd,3.2s) ease-in-out infinite; animation-delay:var(--fdel,0s); }
  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-26px);} }
  .bubble-body{ position:relative; width:220px; height:220px; will-change:transform; }
  .bubble-body .b-img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 12px 18px rgba(0,0,0,.28)); }
  .bubble-body .b-letter{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:104px; font-weight:700; color:#173a5e; text-shadow:0 2px 0 rgba(255,255,255,.8); padding-bottom:14px; }
  .bubble-pos.popped .bubble-body{ animation:popBurst .45s ease-out both; }
  @keyframes popBurst{ 0%{ transform:scale(1); opacity:1;} 55%{ transform:scale(1.5); opacity:.85;} 100%{ transform:scale(0); opacity:0;} }
  .bubble-pos.dragging .bubble-floater{ animation-play-state:paused; }
  .bubble-pos.dragging .bubble-body{ z-index:99; }
  .bubble-pos.returning .bubble-body{ transition:transform .4s cubic-bezier(.34,1.56,.64,1); }
  .bubble-pos.shake .bubble-body{ animation:shakeSm .5s ease; }

  /* ---------------- LEVEL 4 : SECRET CYPHER ---------------- */
  .l4-card{ position:absolute; left:50%; top:318px; transform:translate(-50%,-50%); width:1040px; height:470px; }
  .l4-card .card-inner{ padding:40px 90px; display:flex; align-items:center; justify-content:center; gap:40px; }
  .l4-pic{ width:260px; height:260px; object-fit:contain; filter:drop-shadow(0 10px 16px rgba(0,0,0,.2)); }
  .l4-slots{ display:flex; gap:10px; flex-wrap:nowrap; }
  .l4-tile{ min-width:64px; height:88px; padding:0 8px; border-radius:18px; display:flex; align-items:center; justify-content:center;
    font-size:54px; font-weight:700; color:#4a3627;
    background:linear-gradient(180deg,#ffffff,#e9f2ff); box-shadow:0 5px 0 #b9cbe8, 0 9px 14px rgba(0,0,0,.18); }
  .l4-tile.blank{ background:rgba(255,255,255,.32); box-shadow:inset 0 4px 10px rgba(30,80,140,.35);
    border:5px dashed rgba(255,255,255,.95); color:transparent; }
  .l4-tile.filled-flash{ animation:slotGold .8s ease both; }
  #keyboard{ position:absolute; left:50%; bottom:24px; transform:translateX(-50%); z-index:14;
    display:grid; grid-template-columns:repeat(13, 1fr); gap:12px; width:1496px; }
  .kb-key{ height:96px; border:none; border-radius:22px; font-family:inherit; font-size:46px; font-weight:700; color:#31456b;
    background:linear-gradient(180deg,#ffffff,#dfe9ff); box-shadow:0 7px 0 #a9bce4, 0 12px 18px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center; transition:transform .1s ease, box-shadow .1s ease, filter .2s ease; }
  .kb-key:hover{ filter:brightness(1.06); transform:scale(1.06); }
  .kb-key:active{ transform:translateY(5px); box-shadow:0 2px 0 #a9bce4; }
  .kb-key.used{ background:linear-gradient(180deg,#ffe08a,#f6b93b); color:#7a4d00; box-shadow:0 7px 0 #c98f1b, 0 12px 18px rgba(0,0,0,.25); }

  .kb-key.wrong{ animation:shakeSm .45s ease; }

  /* ---------------- OVERLAYS ---------------- */
  .overlay{ position:absolute; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
    background:rgba(8,24,44,.62); backdrop-filter:blur(6px); }
  .overlay.active{ display:flex; animation:viewFade .3s ease both; }
  .panel{ position:relative; background:linear-gradient(180deg,#fffdf4,#ffeecd); border-radius:48px; padding:56px 72px;
    display:flex; flex-direction:column; align-items:center; gap:26px;
    box-shadow:0 14px 0 rgba(160,110,40,.55), 0 30px 60px rgba(0,0,0,.45), inset 0 4px 0 #ffffff;
    animation:panelPop .5s cubic-bezier(.34,1.56,.64,1) both; max-width:1400px; }
  @keyframes panelPop{ 0%{ transform:scale(.55) rotate(-3deg); opacity:0;} 100%{ transform:scale(1) rotate(0); opacity:1;} }
  .panel h2{ margin:0; font-size:64px; font-weight:700; color:#e2603a; text-shadow:0 3px 0 #fff; letter-spacing:.03em; }
  .panel .panel-sub{ font-size:30px; font-weight:600; color:#8a6a45; margin-top:-14px; }
  .big-btn{ border:none; border-radius:34px; padding:24px 62px; font-family:inherit; font-size:38px; font-weight:700; color:#fff;
    letter-spacing:.04em; text-shadow:0 2px 0 rgba(0,0,0,.25); }
  .big-btn.green{ background:linear-gradient(180deg,#7ddf8a,#3d8b4f); box-shadow:0 9px 0 #2c6e3b, 0 18px 30px rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.45); }
  .big-btn.blue{ background:linear-gradient(180deg,#79c9ff,#2196d3); box-shadow:0 9px 0 #166da0, 0 18px 30px rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.45); }
  .big-btn.orange{ background:linear-gradient(180deg,#ffb37e,#e2603a); box-shadow:0 9px 0 #b44423, 0 18px 30px rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.45); }
  .big-btn:active{ transform:translateY(7px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .btn-row{ display:flex; gap:36px; }
  .result-stars{ display:flex; gap:34px; margin:6px 0 2px; }
  .result-stars img{ width:150px; height:150px; opacity:0; transform:scale(.3) rotate(-40deg); }
  .result-stars img.show{ animation:starPop .55s cubic-bezier(.34,1.8,.64,1) both; }

  /* pause */
  #overlay-pause .panel{ min-width:760px; }

  /* ---------------- TOTAL VICTORY / ALBUM ---------------- */
  #overlay-victory{ z-index:110; }
  .album-panel{ width:1440px; max-height:830px; }
  .album-grid{ display:grid; grid-template-columns:repeat(9, 1fr); gap:18px; width:100%; overflow:hidden; }
  .album-cell{ position:relative; aspect-ratio:1/1.12; border-radius:20px; background:#fffef8;
    box-shadow:inset 0 0 0 5px #ffe3a1, 0 8px 16px rgba(0,0,0,.15);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px;
    animation:cellWiggle 4s ease-in-out infinite; animation-delay:var(--wd,0s); }
  @keyframes cellWiggle{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(1.6deg);} 75%{ transform:rotate(-1.6deg);} }
  .album-cell img{ width:78%; height:66%; object-fit:contain; }
  .album-cell .a-cap{ font-size:19px; font-weight:700; color:#7a5a30; }
  .album-cell.uncollected img{ filter:grayscale(1) brightness(.45); opacity:.4; }
  .album-cell.uncollected .a-cap{ color:#b7a98e; }
  .album-count{ font-size:34px; font-weight:700; color:#3d8b4f; margin-top:-8px; }

  /* ---------------- PARTICLES / FX ---------------- */
  #fx-layer{ position:absolute; inset:0; z-index:55; pointer-events:none; overflow:hidden; }
  .fx-star{ position:absolute; width:44px; height:44px; }
  .fx-star img{ width:100%; height:100%; }
  .fx-dot{ position:absolute; width:22px; height:22px; border-radius:50%; }
  .fx-confetti{ position:absolute; width:20px; height:30px; border-radius:5px; opacity:.95; }
  .fly{ animation:flyOut var(--dur,.9s) cubic-bezier(.17,.67,.35,1) forwards; }
  @keyframes flyOut{ 0%{ transform:translate(0,0) rotate(0) scale(var(--s0,1)); opacity:1;}
    100%{ transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(var(--s1,.4)); opacity:0;} }
  .fall{ animation:confFall var(--dur,2.8s) linear forwards; }
  @keyframes confFall{ 0%{ transform:translate3d(0,-60px,0) rotate(0); opacity:1;}
    100%{ transform:translate3d(var(--sway,40px),1060px,0) rotate(var(--rot,340deg)); opacity:.9;} }

  /* ---------------- WIPE transition ---------------- */
  #wipe{ position:absolute; inset:0; z-index:200; pointer-events:none; opacity:0;

/* ===================== PAUSABLE TIMER MANAGER ===================== */
const Timers={
  list:new Set(),
  set(cb,ms){ const t={cb,left:ms,start:performance.now(),id:0};
    t.id=setTimeout(()=>{Timers.list.delete(t);cb();},ms);
    Timers.list.add(t); return t; },
  clear(t){ if(!t)return; clearTimeout(t.id); Timers.list.delete(t); },
  clearAll(){ Timers.list.forEach(t=>clearTimeout(t.id)); Timers.list.clear(); },
  pause(){ Timers.list.forEach(t=>{ clearTimeout(t.id); t.left=Math.max(0,t.left-(performance.now()-t.start)); }); },
  resume(){ Timers.list.forEach(t=>{ t.start=performance.now();
    t.id=setTimeout(()=>{Timers.list.delete(t);t.cb();},t.left); }); }
};

/* ===================== AUDIO MANAGER (gesture-gated) ===================== */
class AudioManager{
  constructor(){ this.ctx=null; this.master=null; this.muted=false; this.bgmNodes=null; this.htmlPool={}; }
  init(){
    if(this.ctx) { if(this.ctx.state==="suspended") this.ctx.resume(); return; }
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain(); this.master.gain.value=1; this.master.connect(this.ctx.destination);
      if(GAME_ASSETS.audio.bgm) this.startBgm(); else this.startSynthBgm();
    }catch(e){ /* audio unsupported — game remains playable */ }
  }
  setMuted(m){
    this.muted=m;
    if(this.master) this.master.gain.value=m?0:1;
    if(m && window.speechSynthesis) speechSynthesis.cancel();
    document.querySelectorAll("audio.ext-audio").forEach(a=>a.muted=m);
  }
  playFile(url,vol=1,loop=false){
    if(this.muted) return null;
    const a=new Audio(url); a.classList.add("ext-audio"); a.volume=vol; a.loop=loop;
    a.play().catch(()=>{}); return a;
  }
  startBgm(){ this.playFile(GAME_ASSETS.audio.bgm,.45,true); }
  /* --- tiny synth engine (used while placeholder URLs are empty) --- */
  tone(f,t0,dur,type="sine",vol=.18,slide=0){
    if(!this.ctx)return null;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+dur);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+.05);
    return {o,g};
  }
  sfx(key){
    const url=GAME_ASSETS.audio[key];
    if(url){ this.playFile(url); return; }
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime;
    switch(key){
      case "click":   this.tone(660,t,.07,"triangle",.12); break;
      case "banner":  this.tone(300,t,.28,"sine",.14,500); break;
      case "correct": [523,659,784,1046].forEach((f,i)=>this.tone(f,t+i*.09,.32,"triangle",.16)); break;
      case "wrong":   this.tone(220,t,.22,"sine",.12,-60); this.tone(180,t+.16,.3,"sine",.1,-40); break;
      case "pop":     this.tone(900,t,.08,"square",.1,600); this.tone(1400,t+.03,.12,"triangle",.12); break;
      case "star":    this.tone(1568,t,.35,"triangle",.15); this.tone(2093,t+.05,.4,"sine",.12); break;
      case "letterGood": this.tone(880,t,.18,"triangle",.16,300); break;
      case "levelWin":[392,523,659,784,1046,1318].forEach((f,i)=>this.tone(f,t+i*.1,.4,"triangle",.16)); break;
      case "grandWin":[523,659,784,1046,784,1046,1318,1568].forEach((f,i)=>this.tone(f,t+i*.11,.45,"triangle",.16)); break;
    }
  }
  startSynthBgm(){
    if(this.bgmNodes)return;
    const seq=[523,587,659,784, 880,784,659,587];
    let step=0;
    const loop=()=>{ if(!this.ctx)return;
      const t=this.ctx.currentTime;
      const f=seq[step%seq.length]; step++;
      this.tone(f,t,.5,"sine",.035); this.tone(f/2,t,.6,"sine",.02);
    };
    loop(); this.bgmNodes=setInterval(loop,520);
  }
  speak(key){
    const word=GAME_ASSETS.words[key]?GAME_ASSETS.words[key].word:key;
    const url=GAME_ASSETS.audio.voice[word];
    if(url){ this.playFile(url); return; }
    if(this.muted||!window.speechSynthesis)return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(word);
      u.lang="en-US"; u.rate=.82; u.pitch=1.15; u.volume=1;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  stopSpeech(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
}

const fxLayer=$("#fx-layer");
const FX_COLORS=["#ffc93c","#ff8a65","#ab7bdc","#4fc3f7","#58b368","#ffffff"];
function burst(x,y,count=14,stars=true){
  for(let i=0;i<count;i++){
    const useStar=stars && Math.random()<.55;
    const p=el("div",useStar?"fx-star fly":"fx-dot fly");
    if(useStar) p.innerHTML=`<img src="${GAME_ASSETS.ui.starGold}" alt="">`;
    else p.style.background=pick(FX_COLORS);
    const ang=rand(0,Math.PI*2), dist=rand(90,300);
    p.style.left=(x-20)+"px"; p.style.top=(y-20)+"px";
    p.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*dist-90)+"px");
    p.style.setProperty("--rot",rand(-260,260)+"deg");
    p.style.setProperty("--dur",rand(.7,1.2)+"s");
    p.style.setProperty("--s0",rand(.7,1.3));
    p.style.setProperty("--s1",rand(.2,.5));
    fxLayer.appendChild(p);
    p.addEventListener("animationend",()=>p.remove());
  }
}
function burstAtElem(elem,count=14){
  const r=elem.getBoundingClientRect();
  const c=toDesign(r.left+r.width/2, r.top+r.height/2);
  burst(c.x,c.y,count);
}

/* ===================== IMAGE PRELOADER ===================== */
function preload(urls,timeout=2600){
  return new Promise(res=>{
    let done=0; const total=urls.length||1; let finished=false;
    const fin=()=>{ if(!finished){finished=true;res();} };
    urls.forEach(u=>{ if(!u){ if(++done>=total)fin(); return; }
      const im=new Image(); im.onload=im.onerror=()=>{ if(++done>=total)fin(); };
      im.src=u; });
    setTimeout(fin,timeout);
  });
}

const VIEWS={MAIN_MENU:"#view-menu",LEVEL_MAP:"#view-map",GAMEPLAY:"#view-game"};
function wipeTo(fn){

function setState(next){

  Object.values(VIEWS).forEach(v=>$(v).classList.remove("active"));
  if(VIEWS[next]) $(VIEWS[next]).classList.add("active");
  /* Success & Victory modals float over the darkened game window */
  if(next==="LEVEL_SUCCESS"||next==="TOTAL_VICTORY") $("#view-game").classList.add("active");
  $("#hud").classList.toggle("active", next==="GAMEPLAY");
  $("#overlay-pause").classList.remove("active");
  $("#overlay-success").classList.remove("active");
  if(next!=="TOTAL_VICTORY"){ $("#overlay-victory").classList.remove("active"); stopConfetti(); }
  Game.paused=false; stage.classList.remove("stage-paused");
  if(next!=="GAMEPLAY"&&prev==="GAMEPLAY"){ Timers.clearAll(); AudioMan.stopSpeech(); }
}

const LEVELS=[
  { id:1, total:5, letters:["i","j","k","l","m"] },
  { id:2, total:5, pool:"abcdefghijklmnopq".split("") },
  { id:3, total:5, letters:["h","a","g","d","f"] },
  { id:4, total:4, puzzles:[
      {key:"w",mask:"w__d_w"},
      {key:"u",mask:"_m__e_la"},
      {key:"s",mask:"s__k_"},
      {key:"r",mask:"r__b_t"} ] }
];
const levelRoot=$("#level-root");
function startLevel(idx){
  if(Game._starting)return; Game._starting=true;
  wipeTo(()=>{
    Game._starting=false;
    Game.levelIndex=idx; Game.taskIndex=0; Game.mistakes=0;
    Game.level=LEVELS[idx];
    $("#game-bg").src=GAME_ASSETS.backgrounds.levels[idx];
    HUD.build(Game.level.total); HUD.setDone(0);
    levelRoot.innerHTML="";
    setState("GAMEPLAY");
    const preloadList=[];
    if(idx===0||idx===2) Game.level.letters.forEach(k=>preloadList.push(GAME_ASSETS.words[k].img));
    if(idx===1) Game.level.pool.forEach(k=>preloadList.push(GAME_ASSETS.words[k].img));
    if(idx===3) Game.level.puzzles.forEach(p=>preloadList.push(GAME_ASSETS.words[p.key].img));
    preload(preloadList,2200).then(()=>{
      if(Game.state!=="GAMEPLAY")return;
      [mountLevel1,mountLevel2,mountLevel3,mountLevel4][idx]();
      runTask();
    });
  });
}
function runTask(){ Game.level.fn.runTask(Game.taskIndex); }
function taskSolved(){
  Game.substate="FEEDBACK";
  HUD.setDone(Game.taskIndex+1);
  collectWord(Game.level.fn.currentWordKey());
  Timers.set(()=>{
    Game.taskIndex++;
    if(Game.taskIndex>=Game.level.total) completeLevel();
    else runTask();
  },1500);
}
function collectWord(key){
  if(!Game.progress.album.includes(key)){ Game.progress.album.push(key); saveProgress(); }
}
function starsFor(mistakes){ if(mistakes===0)return 3; if(mistakes<=3)return 2; return 1; }
function completeLevel(){
  const stars=starsFor(Game.mistakes);
  const i=Game.levelIndex;
  Game.progress.stars[i]=Math.max(Game.progress.stars[i],stars);
  let unlockedNew=false;
  if(i<3&&!Game.progress.unlocked[i+1]){ Game.progress.unlocked[i+1]=true; unlockedNew=true; }
  saveProgress(); justUnlockedFlag=unlockedNew;
  sfx("levelWin"); stopConfetti();
  setState("LEVEL_SUCCESS");
  showSuccess(stars,i===3);
}
function showSuccess(stars,isLast){
  $("#overlay-success").classList.add("active");
  const box=$("#result-stars"); box.innerHTML="";

  imgs.forEach((im,i)=>{
    setTimeout(()=>{ if(i<stars){ im.src=GAME_ASSETS.ui.starGold; sfx("star"); burstAtElem(im,10);} im.classList.add("show"); },380+i*330);
  });
  $("#success-caption").textContent=STRINGS.captions[stars];
  const btn=$("#btn-to-map");
  btn.textContent=isLast?STRINGS.toAlbum:STRINGS.toMap;
  btn.onclick=()=>{ sfx("click");
    if(isLast){ wipeTo(()=>{ setState("TOTAL_VICTORY"); renderVictory(); }); }
    else{ wipeTo(()=>{ setState("LEVEL_MAP"); renderMap(); }); }
  };
}

const Level3={
  currentKey:"h", popped:false,
  mount(){

    levelRoot.innerHTML=`
      <div class="l3-wrap">
        <div class="word-card l3-card" id="l3card">

        <div class="bubble-zone" id="bubbleZone">
          ${positions.map((p,i)=>`
            <div class="bubble-pos" id="bubble${i}" style="left:${p.x}%">
              <div class="bubble-floater" style="--fd:${(2.8+Math.random()*1.4).toFixed(2)}s; --fdel:-${(Math.random()*2).toFixed(2)}s">
                <div class="bubble-body tap">

                  <div class="b-letter"></div>
                </div>
              </div>
            </div>`).join("")}
        </div>
      </div>`;
    [0,1,2].forEach(i=>this.attachBubble($("#bubble"+i)));
  },
  attachBubble(posEl){
    const body=$(".bubble-body",posEl);
    let downX=0,downY=0,dragging=false,moved=false;
    body.addEventListener("pointerdown",e=>{
      if(Game.substate!=="ACTION"||Game.paused||posEl.classList.contains("popped"))return;
      e.preventDefault(); body.setPointerCapture(e.pointerId);
      downX=e.clientX; downY=e.clientY; dragging=true; moved=false;
      posEl.classList.add("dragging"); posEl.classList.remove("returning");
    });
    body.addEventListener("pointermove",e=>{
      if(!dragging)return;
      const dx=(e.clientX-downX)/Game.scale, dy=(e.clientY-downY)/Game.scale;
      if(Math.abs(dx)+Math.abs(dy)>10)moved=true;
      body.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
    });
    const release=e=>{
      if(!dragging)return; dragging=false;
      posEl.classList.remove("dragging");
      if(Game.substate!=="ACTION"||Game.paused){ body.style.transform=""; return; }
      const blank=$("#l3slots .w-tile.blank");
      const correctLetter=posEl.dataset.letter===GAME_ASSETS.words[this.currentKey].word[0];
      if(!moved){ this.tryLetter(posEl,correctLetter); }
      else{
        let inside=false;
        if(blank){ const r=blank.getBoundingClientRect();
          inside=e.clientX>r.left-28&&e.clientX<r.right+28&&e.clientY>r.top-28&&e.clientY<r.bottom+28; }
        if(inside&&correctLetter){ body.style.transform=""; this.succeed(posEl); }
        else if(inside&&!correctLetter){
          posEl.classList.add("returning"); body.style.transform="";
          setTimeout(()=>posEl.classList.remove("returning"),420);
          this.tryLetter(posEl,false);
        }else{
          posEl.classList.add("returning"); body.style.transform="";
          setTimeout(()=>posEl.classList.remove("returning"),420);
        }
      }
    };
    body.addEventListener("pointerup",release);
    body.addEventListener("pointercancel",release);
  },
  runTask(){
    this.currentKey=Game.level.letters[Game.taskIndex];
    const data=GAME_ASSETS.words[this.currentKey];
    const rest=data.word.slice(1);
    showBanner(STRINGS.banners[2].title,STRINGS.banners[2].sub,()=>{
      if(Game.state!=="GAMEPLAY")return;
      $("#l3pic").src=data.img;
      const slots=$("#l3slots"); slots.innerHTML="";
      const blank=el("div","w-tile blank","_"); slots.appendChild(blank);
      rest.split("").forEach(ch=>slots.appendChild(el("div","w-tile",ch)));
      const letters="abcdefghijklmnopqrstuvwxyz".split("").filter(l=>l!==data.word[0]);
      const options=shuffle([data.word[0],pick(letters),pick(letters.filter(l=>l!==data.word[0]))]).slice(0,3);
      const uniq=[...new Set(options)]; while(uniq.length<3){const c=pick(letters); if(!uniq.includes(c))uniq.push(c);}
      shuffle(uniq).forEach((letter,i)=>{
        const posEl=$("#bubble"+i);
        posEl.classList.remove("popped","shake");
        posEl.dataset.letter=letter;
        $(".b-letter",posEl).textContent=letter;
        $(".bubble-body",posEl).style.transform="";
      });
      Game.substate="ACTION";
    });
  },
  tryLetter(posEl,correct){
    if(correct){ this.succeed(posEl); }
    else{
      Game.mistakes++;
      posEl.classList.add("shake"); sfx("wrong");
      Timers.set(()=>posEl.classList.remove("shake"),520);
    }
  },
  succeed(posEl){
    Game.substate="FEEDBACK";
    posEl.classList.add("popped");
    sfx("pop");
    burstAtElem($(".bubble-body",posEl),16);
    const blank=$("#l3slots .w-tile.blank");
    blank.textContent=GAME_ASSETS.words[this.currentKey].word[0];
    blank.classList.remove("blank"); blank.classList.add("filled-flash");
    Timers.set(()=>{ sfx("correct"); AudioMan.speak(this.currentKey); },320);
    HUD.setDone(Game.taskIndex+1);
    collectWord(this.currentKey);
    Timers.set(()=>{
      Game.taskIndex++;
      if(Game.taskIndex>=Game.level.total) completeLevel(); else this.runTask();
    },1500);
  },
  currentWordKey(){ return this.currentKey; }
};

/* ===================== LEVEL 4 : THE SECRET CYPHER ===================== */
const Level4={
  currentKey:"w", filled:0, needed:0,
  mount(){
    levelRoot.innerHTML=`
      <div class="l4-wrap">
        <div class="word-card l4-card" id="l4card">
          <img class="frame-img" src="${GAME_ASSETS.ui.cardFrame}" alt="">
          <div class="card-inner">
            <img class="l4-pic" id="l4pic" alt="">
            <div class="l4-slots" id="l4slots"></div>
          </div>
        </div>
        <div id="keyboard"></div>
      </div>`;
    const kb=$("#keyboard");
    "abcdefghijklmnopqrstuvwxyz".split("").forEach(ch=>{
      const k=el("button","kb-key tap",ch);
      k.dataset.letter=ch;
      k.addEventListener("pointerdown",e=>{ e.preventDefault(); this.press(k); });
      kb.appendChild(k);
    });
  },
  runTask(){
    const puzzle=Game.level.puzzles[Game.taskIndex];
    this.currentKey=puzzle.key;
    const data=GAME_ASSETS.words[puzzle.key];
    showBanner(STRINGS.banners[3].title,STRINGS.banners[3].sub,()=>{
      if(Game.state!=="GAMEPLAY")return;
      $("#l4pic").src=data.img;
      const slots=$("#l4slots"); slots.innerHTML="";
      this.missingLetters=new Set();
      let blanks=0;
      puzzle.mask.split("").forEach((ch,idx)=>{
        if(ch==="_"){ blanks++; this.missingLetters.add(data.word[idx]); slots.appendChild(el("div","l4-tile blank","_")).dataset.want=data.word[idx]; }
        else slots.appendChild(el("div","l4-tile",ch));
      });
      this.needed=blanks; this.filled=0;
      $$(".kb-key").forEach(k=>{ k.classList.remove("used","wrong"); k.disabled=false; });
      Game.substate="ACTION";
    });
  },
  press(keyEl){
    if(Game.substate!=="ACTION"||Game.paused)return;
    if(keyEl.classList.contains("used")||keyEl.classList.contains("wrong"))return;
    const letter=keyEl.dataset.letter;
    if(this.missingLetters.has(letter)){
      sfx("letterGood");
      keyEl.classList.add("used");
      let newly=0;
      $$("#l4slots .l4-tile.blank").forEach(t=>{
        if(t.dataset.want===letter){
          t.textContent=letter; t.classList.remove("blank"); t.classList.add("filled-flash");
          burstAtElem(t,6,false); newly++;
        }
      });
      this.filled=(this.filled||0)+newly;
      this.missingLetters.delete(letter);
      if(this.missingLetters.size===0){
        Game.substate="FEEDBACK";
        sfx("correct"); $("#l4card").classList.add("shake"); setTimeout(()=>$("#l4card")&&$("#l4card").classList.remove("shake"),500);
        burstAtElem($("#l4card"),22);
        Timers.set(()=>AudioMan.speak(this.currentKey),300);
        HUD.setDone(Game.taskIndex+1);
        collectWord(this.currentKey);
        Timers.set(()=>{
          Game.taskIndex++;
          if(Game.taskIndex>=Game.level.total) completeLevel(); else this.runTask();
        },1500);
      }
    }else{
      Game.mistakes++;
      sfx("wrong");
      keyEl.classList.add("wrong");
      $("#l4card").classList.add("shake"); setTimeout(()=>$("#l4card")&&$("#l4card").classList.remove("shake"),500);
      Timers.set(()=>{ keyEl.classList.remove("wrong"); },1100);
    }
  },
  currentWordKey(){ return this.currentKey; }
};
const mountLevel1=()=>{Game.level.fn=Level1;Level1.mount();};
const mountLevel2=()=>{Game.level.fn=Level2;Level2.mount();};
const mountLevel3=()=>{Game.level.fn=Level3;Level3.mount();};
const mountLevel4=()=>{Game.level.fn=Level4;Level4.mount();};

/* ===================== PAUSE SYSTEM ===================== */
function setPaused(p){
  if(Game.state!=="GAMEPLAY")return;
  Game.paused=p;
  stage.classList.toggle("stage-paused",p);
  $("#overlay-pause").classList.toggle("active",p);
  if(p){ Timers.pause(); try{window.speechSynthesis&&speechSynthesis.pause();}catch(e){} }
  else{ Timers.resume(); try{window.speechSynthesis&&speechSynthesis.resume();}catch(e){} }
}

/* ===================== TOTAL VICTORY / ALBUM ===================== */
function renderVictory(){
  const grid=$("#album-grid"); grid.innerHTML="";
  const keys=Object.keys(GAME_ASSETS.words);
  const got=new Set(Game.progress.album);
  keys.forEach((k,i)=>{
    const owned=got.has(k);
    const cell=el("div","album-cell"+(owned?"":" uncollected"));
    cell.style.setProperty("--wd",(Math.random()*2).toFixed(2)+"s");
    cell.innerHTML=`<img src="${GAME_ASSETS.words[k].img}" alt="${GAME_ASSETS.words[k].word}">
      <div class="a-cap">${owned?GAME_ASSETS.words[k].word:"? ? ?"}</div>`;
    grid.appendChild(cell);
  });
  $("#album-count").textContent=STRINGS.albumLabel(got.size,keys.length);
  $("#overlay-victory").classList.add("active");
  sfx("grandWin"); startConfetti();
}

/* ===================== SOUND TOGGLE WIDGETS ===================== */
function refreshSoundButtons(){
  $$(".snd-btn img, #btn-hud-sound").forEach(n=>{
    const isHud=n.id==="btn-hud-sound";
    const src=AudioMan.muted?GAME_ASSETS.ui.soundOff:GAME_ASSETS.ui.soundOn;
    if(isHud){ n.innerHTML=""; const im=el("img"); im.src=src; im.style.cssText="width:100%;height:100%;object-fit:contain;"; n.appendChild(im); }
    else n.src=src;
  });
}
function toggleMute(){ AudioMan.init(); AudioMan.setMuted(!AudioMan.muted); refreshSoundButtons(); }

/* ===================== GLOBAL WIRING ===================== */
function wireUI(){
  /* menu decorations */
  $("#menu-title").textContent=STRINGS.gameTitle;
  $("#menu-sub").textContent=STRINGS.gameSub;
  $("#play-label").textContent=STRINGS.play;
  $("#menu-foot").textContent=STRINGS.footer;
  $("#map-title").textContent=STRINGS.mapTitle;
  $("#pause-title").textContent=STRINGS.pauseTitle;
  $("#btn-resume").textContent=STRINGS.resume;
  $("#btn-quit").textContent=STRINGS.quit;
  $("#success-title").textContent=STRINGS.successTitle;
  $("#btn-to-map").textContent=STRINGS.toMap;
  $("#victory-title").textContent=STRINGS.victoryTitle;
  $("#btn-play-again").textContent=STRINGS.playAgain;
  $("#menu-bg").src=GAME_ASSETS.backgrounds.menu;
  $("#map-bg").src=GAME_ASSETS.backgrounds.menu;
  $("#btn-play-img").src=GAME_ASSETS.ui.playButton;
  $("#btn-back").innerHTML=svgIcon("back");
  $("#btn-pause").innerHTML=svgIcon("pause");
  $("#btn-map-home").innerHTML=svgIcon("home");
  /* floating letters on menu */
  const ml=$("#menu-letters");
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").filter((_,i)=>i%3===0).forEach(ch=>{
    const s=el("div","float-letter",ch);
    s.style.left=rand(2,94)+"%";
    s.style.fontSize=rand(48,110)+"px";
    s.style.animationDuration=rand(9,20)+"s";
    s.style.animationDelay=-rand(0,18)+"s";
    ml.appendChild(s);
  });
  /* sound buttons */
  [["menu"]].forEach(()=>{});
  const sndMenu=el("button","snd-btn snd-menu tap"); sndMenu.innerHTML=`<img src="${GAME_ASSETS.ui.soundOn}" alt="Sound">`;
  $("#view-menu").appendChild(sndMenu);
  const sndMap=el("button","snd-btn snd-menu tap"); sndMap.innerHTML=`<img src="${GAME_ASSETS.ui.soundOn}" alt="Sound">`;
  $("#view-map").appendChild(sndMap);
  [sndMenu,sndMap,$("#btn-hud-sound")].forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();sfx("click");toggleMute();}));
  /* PLAY */
  $("#btn-play").addEventListener("pointerdown",e=>{
    e.preventDefault();
    AudioMan.init(); sfx("click");
    wipeTo(()=>{ setState("LEVEL_MAP"); renderMap(); });
  });
  /* map home */
  $("#btn-map-home").addEventListener("pointerdown",e=>{ e.preventDefault(); sfx("click");
    stopConfetti(); wipeTo(()=>setState("MAIN_MENU")); });
  /* HUD */
  $("#btn-back").addEventListener("pointerdown",e=>{ e.preventDefault(); sfx("click");
    AudioMan.stopSpeech(); Timers.clearAll(); setPaused(false);
    wipeTo(()=>{ setState("LEVEL_MAP"); renderMap(); }); });
  $("#btn-pause").addEventListener("pointerdown",e=>{ e.preventDefault(); sfx("click"); setPaused(true); });
  $("#btn-resume").addEventListener("pointerdown",e=>{ e.preventDefault(); sfx("click"); setPaused(false); });
  $("#btn-quit").addEventListener("pointerdown",e=>{ e.preventDefault(); sfx("click");
    AudioMan.stopSpeech(); Timers.clearAll(); setPaused(false);
    wipeTo(()=>setState("MAIN_MENU")); });
  /* victory */
  $("#btn-play-again").addEventListener("pointerdown",e=>{ e.preventDefault(); sfx("click");
    stopConfetti(); wipeProgress(); Game.progress=loadProgress();
    wipeTo(()=>setState("MAIN_MENU")); });
  /* keyboard shortcut: Esc toggles pause */
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&Game.state==="GAMEPLAY") setPaused(!Game.paused);
  });
  refreshSoundButtons();
}

/* ===================== BOOT ===================== */
function boot(){
  fitStage();
  Game.progress=loadProgress();
  wireUI();
  const critical=[
    GAME_ASSETS.backgrounds.menu, GAME_ASSETS.ui.playButton, GAME_ASSETS.ui.cardFrame,
    GAME_ASSETS.ui.starGold, GAME_ASSETS.ui.starEmpty, GAME_ASSETS.ui.lock,
    ...GAME_ASSETS.mapMarkers, ...GAME_ASSETS.backgrounds.levels,
    GAME_ASSETS.monsters.A.joy, GAME_ASSETS.monsters.A.sad,
    GAME_ASSETS.monsters.B.joy, GAME_ASSETS.monsters.B.sad,
    GAME_ASSETS.ui.bubble, GAME_ASSETS.ui.balloon,
    GAME_ASSETS.ui.soundOn, GAME_ASSETS.ui.soundOff
  ];
  preload(critical,3500).then(()=>{
    setState("MAIN_MENU");
    $("#loader").classList.add("done");
  });
}
boot();
</script>
